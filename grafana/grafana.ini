[paths]
data = /workspace/screeps/grafana/data
logs = /workspace/screeps/grafana/data/log
plugins = /workspace/screeps/grafana/data/plugins
provisioning = /workspace/screeps/grafana/provisioning
[server]
http_addr = 127.0.0.1
http_port = 3000
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[users]
allow_sign_up = false
[auth.anonymous]
enabled = true
org_role = Viewer
[dashboards]
default_home_dashboard_path = /workspace/screeps/grafana/dashboards/screeps.json
[plugins]
preinstall_disabled = true
